name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gradle wrapper jar
        run: curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar

      - name: Download and extract Stockfish
        run: |
          mkdir -p app/src/main/assets
          # Link chính thức từ stockfishchess.org (bản ARM64 universal)
          curl -L -o sf.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_16.1/stockfish-android-arm64-universal.tar.gz
          tar -xzf sf.tar.gz -C temp_sf
          # Copy file binary ra assets
          find temp_sf -type f -name "stockfish*" -exec cp {} app/src/main/assets/stockfish.bin \;
          chmod +x app/src/main/assets/stockfish.bin

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chesscam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
