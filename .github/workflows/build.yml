name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gradle wrapper jar
        run: curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar

      - name: Download Stockfish for Android
        run: |
          mkdir -p app/src/main/assets
          # Tải trực tiếp file binary arm64-v8a, không giải nén zip
          curl -L -o app/src/main/assets/stockfish.bin https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-android-arm64-v8a
          chmod +x app/src/main/assets/stockfish.bin

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chesscam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
