name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gradle wrapper jar
        run: curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar

      - name: Setup Stockfish Library
        run: |
          # Tạo thư mục jniLibs cho ARM64
          mkdir -p app/src/main/jniLibs/arm64-v8a
          # Tải Stockfish và đặt tên chuẩn xác (libstockfish.so)
          curl -L -o app/src/main/jniLibs/arm64-v8a/libstockfish.so https://github.com/ptrkstr/stockfish-android-arm64/raw/main/stockfish
          chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chesscam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
